version: '3.8'

services:
  storage-service:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - STORAGE_PROVIDER=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      - LOCAL_BASE_URL=http://localhost:3001/uploads
      - ADMIN_API_KEY=your-secret-admin-api-key
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src
      - ./server.js:/app/server.js
    restart: unless-stopped

